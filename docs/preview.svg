<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#131a33"/>
      <stop offset="55%" stop-color="#080b14"/>
      <stop offset="100%" stop-color="#04050a"/>
    </radialGradient>
    <linearGradient id="arcA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b7cff"/>
      <stop offset="100%" stop-color="#ff4d8d"/>
    </linearGradient>
    <linearGradient id="arcB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5c0"/>
      <stop offset="100%" stop-color="#3bd6ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="600" cy="300" r="230" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="54"/>

  <g filter="url(#glow)" fill="none" stroke-linecap="round">
    <path d="M600 110 A190 190 0 0 0 600 490" stroke="url(#arcA)" stroke-width="26"/>
    <path d="M600 490 A190 190 0 0 0 600 110" stroke="url(#arcB)" stroke-width="26"/>
  </g>

  <circle cx="600" cy="300" r="120" fill="#070a12"/>
  <circle cx="600" cy="300" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="600" cy="300" r="46" fill="none" stroke="#8b7cff" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="600" cy="300" r="10" fill="#00e5c0"/>

  <text x="600" y="560" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif"
        font-size="34" font-weight="600" fill="#f2f4ff" letter-spacing="1">Aurora Ring</text>
  <text x="600" y="590" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif"
        font-size="16" fill="#9aa3bd">camera-ring control for HyperOS · Redmi Turbo 4 Pro</text>
</svg>
